name: 环境信息
description: 版本、profile、系统等
title: "[Env] "
labels: ["question"]
body:
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
    validations:
      required: true
  - type: input
    id: seeker-version
    attributes:
      label: dsh-seeker-bot 版本
      placeholder: 0.2.2
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile 名
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 系统
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 问题
    validations:
      required: true
