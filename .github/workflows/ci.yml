name: CI

# 说明（为什么这里只跑 build + 单测）：
#   - typecheck：tsconfig.json 的 paths 指向本机的 ../deepseek-harness 与
#     ../dsh-runtime 源码 checkout（130 个 src 文件 import @deepseek-ai/* 类型），
#     runner 上没有这些目录，跑 tsc 必然失败；本仓库的 tsconfig 也还没收敛到可全局通过。
#     需要在带 DSH checkout 的机器上本地执行 npm run typecheck。
#   - smoke：其中包含依赖真 Chrome + 真 DSH Web（127.0.0.1:3080）的端到端断言，
#     CI 无宿主环境，本地执行 npm run smoke。
#   所以 CI 只保留 Linux 上可稳定复现的门禁：构建产物 + 纯逻辑单测 + 打包清单。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify bundles
        run: |
          test -s lib/index.js || { echo "missing lib/index.js"; exit 1; }
          test -s lib/client.js || { echo "missing lib/client.js"; exit 1; }
          node -e "import('./lib/index.js').then(m => { if (typeof m.apply !== 'function') { console.error('host bundle has no apply()'); process.exit(1) } console.log('host bundle ok') })"
      - name: Unit tests
        run: npm test
      - name: Package dry-run
        run: npm pack --dry-run
