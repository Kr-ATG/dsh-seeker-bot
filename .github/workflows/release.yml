name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Pack tarball
        run: |
          mkdir -p dist-pkg
          npm pack --pack-destination dist-pkg
          ls -la dist-pkg
      - name: Upload tarball to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-pkg/*.tgz
